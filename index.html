<meta charset="UTF-8">
<title>Movie Club</title>
<meta name="description" content="Movie Club's Wednesday screening, staged like a 1970s repertory-cinema poster.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Oswald:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<div class="grain"></div>

<main>
  <section class="hero">
    <div class="hero-bg"></div>
    <svg class="hero-hills" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,24 L0,14 Q12,8 22,13 T45,10 Q58,6 68,12 T90,9 L100,13 L100,24 Z"></path>
    </svg>
    <div class="fireflies" id="fireflies" aria-hidden="true"></div>

    <div class="hero-content">
      <p class="kicker">Movie Club &mdash; Next Screening</p>
      <h1 class="jp-title" id="hero-jp"></h1>
      <p class="en-title" id="hero-en"></p>
      <p class="hero-sub" id="hero-sub"></p>
      <div class="scroll-cue"><span class="stem"></span>Reel One</div>
    </div>
  </section>

  <section class="reel reel--screening wrap">
    <p class="reel-label" data-reel>The Screening</p>
    <div class="screening-grid">
      <div class="screening-item">
        <span class="si-label">Date</span>
        <span class="si-value accent" id="si-date"></span>
      </div>
      <div class="screening-item" id="si-doors-wrap">
        <span class="si-label">Doors</span>
        <span class="si-value" id="si-doors"></span>
      </div>
      <div class="screening-item" id="si-start-wrap">
        <span class="si-label">Film Starts</span>
        <span class="si-value" id="si-start"></span>
      </div>
      <div class="screening-item">
        <span class="si-label">Where</span>
        <span class="si-value" id="si-location"></span>
      </div>
    </div>
    <p class="note" id="si-note" hidden></p>
  </section>

  <section class="reel reel--story wrap">
    <p class="reel-label" data-reel>The Film</p>
    <div class="story-grid">
      <dl class="specs" id="specs"></dl>
      <p class="synopsis" id="synopsis"></p>
    </div>
  </section>

  <section class="reel reel--upcoming wrap" id="upcoming-reel" hidden>
    <p class="reel-label" data-reel>Coming Attractions</p>
    <div class="bill" id="upcoming-bill"></div>
  </section>

  <section class="reel reel--past wrap" id="past-reel" hidden>
    <p class="reel-label" data-reel>Past Screenings</p>
    <div class="bill" id="past-bill"></div>
    <p class="archive-link"><a href="archive.html">View full archive &rarr;</a></p>
  </section>

  <footer class="credits wrap">
    <p class="credits-line" id="credits-presents"></p>
    <p class="credits-line main" id="credits-by"></p>
    <p class="credits-jp" id="credits-jp" hidden></p>
    <p class="credits-en" id="credits-en"></p>
    <p class="credits-line" style="margin-top:1.8rem;">Screening as part of Movie Club</p>
    <p class="credits-line"><a href="archive.html">Archive</a></p>
  </footer>
</main>

<script src="movies.js"></script>
<script>
  (function(){
    var REEL_WORDS = ["One","Two","Three","Four","Five","Six"];
    var data = (window.MOVIE_CLUB && window.MOVIE_CLUB.screenings) || [];
    var todayISO = new Date().toISOString().slice(0, 10);

    var sorted = data.slice().sort(function(a, b){
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    var upcoming = sorted.filter(function(s){ return s.date >= todayISO; });
    var past = sorted.filter(function(s){ return s.date < todayISO; }).reverse();

    var featured = null;
    if (window.MOVIE_CLUB && window.MOVIE_CLUB.featuredId) {
      featured = sorted.filter(function(s){ return s.id === window.MOVIE_CLUB.featuredId; })[0] || null;
    }
    if (!featured) featured = upcoming[0] || sorted[sorted.length - 1] || null;

    var upcomingOthers = upcoming.filter(function(s){ return !featured || s.id !== featured.id; });

    function fmt(iso, opts){
      var d = new Date(iso + "T00:00:00Z");
      return new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: "UTC" }, opts)).format(d);
    }
    function fmtFull(iso){ return fmt(iso, { weekday: "short", month: "short", day: "numeric" }); }
    function fmtShort(iso){ return fmt(iso, { month: "short", day: "numeric" }); }

    function addSpec(dl, label, value){
      if (!value) return;
      var div = document.createElement("div");
      div.className = "spec";
      var dt = document.createElement("dt"); dt.textContent = label;
      var dd = document.createElement("dd"); dd.textContent = value;
      div.appendChild(dt); div.appendChild(dd);
      dl.appendChild(div);
    }

    function buildBill(container, list, kind){
      list.forEach(function(s){
        var row = document.createElement("div");
        row.className = "bill-row" + (kind === "past" ? " past" : "");
        var date = document.createElement("span");
        date.className = "bill-date";
        date.textContent = fmtShort(s.date);
        var title = document.createElement("span");
        title.className = "bill-title";
        title.textContent = s.titleEn + (s.titleJp ? " · " + s.titleJp : "");
        row.appendChild(date);
        row.appendChild(title);
        container.appendChild(row);
      });
    }

    if (featured) {
      var jpEl = document.getElementById("hero-jp");
      var enEl = document.getElementById("hero-en");
      if (featured.titleJp) {
        jpEl.textContent = featured.titleJp;
      } else {
        jpEl.hidden = true;
        enEl.classList.add("solo");
      }
      enEl.textContent = featured.titleEn;

      var subParts = [featured.director, featured.year, featured.studio].filter(Boolean);
      document.getElementById("hero-sub").textContent =
        (featured.director ? featured.director + ", " : "") +
        (featured.year || "") +
        (featured.studio ? " · " + featured.studio : "");

      document.getElementById("si-date").textContent = fmtFull(featured.date);
      document.getElementById("si-location").textContent = featured.location || "Location TBD";

      if (featured.doors) document.getElementById("si-doors").textContent = featured.doors;
      else document.getElementById("si-doors-wrap").hidden = true;

      if (featured.start) document.getElementById("si-start").textContent = featured.start;
      else document.getElementById("si-start-wrap").hidden = true;

      var noteEl = document.getElementById("si-note");
      if (featured.note) { noteEl.textContent = featured.note; noteEl.hidden = false; }

      var dl = document.getElementById("specs");
      addSpec(dl, "Director", featured.director);
      addSpec(dl, "Studio", featured.studio);
      addSpec(dl, "Year", featured.year);
      addSpec(dl, "Runtime", featured.runtime);
      addSpec(dl, "Language", featured.language);
      addSpec(dl, "Based On", featured.basedOn);

      var synEl = document.getElementById("synopsis");
      if (featured.synopsis) {
        var text = featured.synopsis;
        var drop = document.createElement("span");
        drop.className = "drop";
        drop.textContent = text.charAt(0);
        synEl.appendChild(drop);
        synEl.appendChild(document.createTextNode(text.slice(1)));
      }

      document.getElementById("credits-presents").textContent =
        (featured.studio || "Movie Club") + " presents";
      document.getElementById("credits-by").textContent =
        (featured.director ? "A Film by " + featured.director : featured.titleEn) +
        (featured.basedOn ? " · Based on " + featured.basedOn : "");
      if (featured.titleJp) {
        var cjp = document.getElementById("credits-jp");
        cjp.textContent = featured.titleJp;
        cjp.hidden = false;
      }
      document.getElementById("credits-en").textContent = featured.titleEn;
    } else {
      document.getElementById("hero-en").textContent = "No screenings yet";
      document.getElementById("hero-sub").textContent = "Add one in movies.js to get started.";
      document.querySelector(".reel--screening").hidden = true;
      document.querySelector(".reel--story").hidden = true;
    }

    if (upcomingOthers.length) {
      buildBill(document.getElementById("upcoming-bill"), upcomingOthers, "upcoming");
      document.getElementById("upcoming-reel").hidden = false;
    }
    if (past.length) {
      buildBill(document.getElementById("past-bill"), past, "past");
      document.getElementById("past-reel").hidden = false;
    }

    var visibleReels = Array.prototype.filter.call(
      document.querySelectorAll(".reel"),
      function(r){ return !r.hidden; }
    );
    visibleReels.forEach(function(reel, i){
      var label = reel.querySelector("[data-reel]");
      if (label) label.textContent = "Reel " + (REEL_WORDS[i] || (i + 1)) + " — " + label.textContent.replace(/^Reel \w+ — /, "");
    });
  })();

  (function(){
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var host = document.getElementById("fireflies");
    if (!host || reduce) return;
    var COUNT = 18;
    for (var i = 0; i < COUNT; i++){
      var f = document.createElement("span");
      f.className = "firefly";
      var x = Math.random() * 100;
      var y = 40 + Math.random() * 58;
      var dx = (Math.random() * 24 - 12).toFixed(0) + "px";
      var dy = (-16 - Math.random() * 26).toFixed(0) + "px";
      var dur = (6 + Math.random() * 6).toFixed(1) + "s";
      var delay = (Math.random() * 6).toFixed(1) + "s";
      f.style.left = x + "%";
      f.style.top = y + "%";
      f.style.setProperty("--dx", dx);
      f.style.setProperty("--dy", dy);
      f.style.setProperty("--dur", dur);
      f.style.setProperty("--delay", delay);
      host.appendChild(f);
    }
  })();
</script>
