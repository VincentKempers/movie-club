<meta charset="UTF-8">
<title>Archive — Movie Club</title>
<meta name="description" content="Movie Club's archive of past screenings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Oswald:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="archive.css">

<div class="grain"></div>

<main>
  <section class="archive-header wrap">
    <a class="back-link" href="index.html">&larr; Movie Club</a>
    <p class="kicker">Movie Club &mdash; Archive</p>
    <h1 class="archive-title">Past Screenings</h1>
    <p class="archive-sub">Everything Movie Club has screened so far, in reverse chronological order.</p>
  </section>

  <section class="archive-list wrap" id="archive-list"></section>
  <p class="empty-note wrap" id="archive-empty" hidden>Nothing's screened yet — check back after the first showing.</p>

  <footer class="credits wrap">
    <p class="credits-line"><a href="index.html">&larr; Back to Movie Club</a></p>
  </footer>
</main>

<script src="movies.js"></script>
<script>
  (function(){
    var data = (window.MOVIE_CLUB && window.MOVIE_CLUB.screenings) || [];
    var todayISO = new Date().toISOString().slice(0, 10);

    var past = data
      .filter(function(s){ return s.date < todayISO; })
      .sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });

    function fmt(iso, opts){
      var d = new Date(iso + "T00:00:00Z");
      return new Intl.DateTimeFormat("en-US", Object.assign({ timeZone: "UTC" }, opts)).format(d);
    }
    function fmtFull(iso){ return fmt(iso, { weekday: "long", year: "numeric", month: "long", day: "numeric" }); }

    var list = document.getElementById("archive-list");

    if (!past.length) {
      document.getElementById("archive-empty").hidden = false;
      return;
    }

    past.forEach(function(s){
      var card = document.createElement("article");
      card.className = "archive-card";

      var date = document.createElement("p");
      date.className = "archive-date";
      date.textContent = fmtFull(s.date);
      card.appendChild(date);

      if (s.titleJp) {
        var jp = document.createElement("p");
        jp.className = "archive-jp";
        jp.textContent = s.titleJp;
        card.appendChild(jp);
      }

      var en = document.createElement("p");
      en.className = "archive-en" + (s.titleJp ? "" : " solo");
      en.textContent = s.titleEn || "Untitled";
      card.appendChild(en);

      var metaParts = [s.director, s.year, s.studio, s.runtime].filter(Boolean);
      if (metaParts.length) {
        var meta = document.createElement("p");
        meta.className = "archive-meta";
        metaParts.forEach(function(part){
          var span = document.createElement("span");
          span.textContent = part;
          meta.appendChild(span);
        });
        card.appendChild(meta);
      }

      if (s.synopsis) {
        var syn = document.createElement("p");
        syn.className = "archive-synopsis";
        syn.textContent = s.synopsis;
        card.appendChild(syn);
      }

      if (s.note) {
        var note = document.createElement("p");
        note.className = "archive-note";
        note.textContent = s.note;
        card.appendChild(note);
      }

      list.appendChild(card);
    });
  })();
</script>
